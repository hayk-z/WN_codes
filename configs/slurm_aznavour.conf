# Aznavour SLURM configuration
# Edit these values per job or clone this file for other clusters.

CLUSTER_NAME="aznavour"
JOB_NAME="arm"
PARTITION="compute"
WALLTIME="240:00:00"
NODES="1"
NTASKS="32"
MEMORY="60G"
OUTPUT_FILE="slurm-%j.out"
OMP_NUM_THREADS="1"

# Modules loaded before running the calculation.
# Replace with module names available on aznavour§.
MODULES=(
  "vasp/6.4.3_gnu_ompi_mkl_omp"
)

# Command executed in WORKDIR.
RUN_COMMAND="vasp_std"

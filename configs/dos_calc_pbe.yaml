job_name_prefix: dos_pbe
potcar_root: data/potcars

step1_relax:
  # Add or remove any ASE Vasp keyword here without code edits.
  # Examples: lasph, lcharg, lwave, nelm, algo, ivdw, ispin, magmom, etc.
  vasp_tags:
    xc: PBE
    encut: 520
    kpts: [9, 9, 1]
    ediff: 1e-5
    ismear: 0
    sigma: 0.05
    ibrion: 2
    nsw: 120
    isif: 2
    lwave: false
    lcharg: false
    ivdw: 11
    vdw_s8: 0.109 
    vdw_sr: 1.129
    kpar: 2
    ncore: 2
    lreal: auto

step2_scf:
  vasp_tags:
    kpts: [14, 14, 1]
    lwave: true
    lcharg: true
    nsw: 0
    ibrion: -1
    ismear: 0
    sigma: 0.05
    ivdw: 11
    vdw_s8: 0.109 
    vdw_sr: 1.129
    kpar: 2
    ncore: 2
    lreal: auto

step3_dos:
  vasp_tags:
    kpts: [14, 14, 1]
    icharge: 11 # Use charge density from previous SCF step
    lorbit: 11
    nedos: 1000
    nsw: 0
    ismear: 0
    sigma: 0.05
    ibrion: -1
    lwave: false
    lcharg: false
    ivdw: 11
    vdw_s8: 0.109 
    vdw_sr: 1.129
    kpar: 2
    ncore: 2
    lreal: auto

step4_band:
  # Tolerances used for 2D layer-group symmetry (spglib) and seekpath.
  symmetry_tolerance: 0.1
  angle_tolerance: 1.0
  # 0=a, 1=b, 2=c is non-periodic direction; "auto" chooses longest lattice vector.
  aperiodic_dir: auto
  # Number of points per line segment in line-mode KPOINTS.
  band_points_per_segment: 40
  # Same static setup as DOS step, but intentionally without NEDOS.
  vasp_tags:
    kpts: [14, 14, 1]
    icharge: 11
    lorbit: 11
    nsw: 0
    ibrion: -1
    lwave: false
    lcharg: false
    vdw_s8: 0.109 
    vdw_sr: 1.129
    ismear: 0
    sigma: 0.05
    ivdw: 11
    kpar: 2
    ncore: 2
    lreal: auto
# YSU2 SLURM configuration
# Edit these values per job or clone this file for other clusters.

CLUSTER_NAME="ysu2"
JOB_NAME="vasp_ysu2"
PARTITION="priority"
WALLTIME="240:00:00"
NODES="1"
NTASKS="16"
MEMORY="60G"
OUTPUT_FILE="slurm-%j.out"
OMP_NUM_THREADS="1"

# Modules loaded before running the calculation.
# Replace with module names available on YSU2.
MODULES=(
  "vasp/6.5.1_gnu_ompi_mkl_omp"
)

# Command executed in WORKDIR.
RUN_COMMAND="vasp_std"
